<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Watch Movies & Shows</title>
    <!-- HLS.js Library for smooth .m3u8 streaming on all devices -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background: #080808; color: #ffffff; min-height: 100vh; }
        header { width: 100%; height: 70px; background: #0d0d0d; border-bottom: 1px solid #202020; display: flex; align-items: center; padding: 0 42px; gap: 25px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 25px; font-weight: 800; color: #e50914; white-space: nowrap; }
        .logo span { color: #ffffff; }
        .search-box { flex: 1; max-width: 500px; }
        .search-box input { width: 100%; height: 42px; border: 1px solid #242424; border-radius: 25px; background: #151515; color: white; padding: 0 18px; outline: none; font-size: 14px; }
        .search-box input:focus { border-color: #e50914; }
        .admin-btn { margin-left: auto; text-decoration: none; background: #e50914; color: white; padding: 11px 18px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .admin-btn:hover { background: #ff1722; }
        .navigation { display: flex; gap: 10px; padding: 22px 42px 10px; overflow-x: auto; }
        .category-btn { border: none; background: #171717; color: #aaa; padding: 9px 20px; border-radius: 22px; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .category-btn:hover { color: white; }
        .category-btn.active { background: #e50914; color: white; }
        main { padding: 20px 42px 60px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 20px; }
        .section-title { font-size: 22px; border-left: 4px solid #e50914; padding-left: 10px; }
        .movie-count { color: #777; font-size: 13px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px; }
        .movie-card { background: #111111; border: 1px solid #1e1e1e; border-radius: 8px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; min-width: 0; }
        .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
        .poster-container { width: 100%; height: 255px; background: #151515; position: relative; overflow: hidden; }
        .poster-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .movie-category { position: absolute; top: 9px; left: 9px; background: rgba(229, 9, 20, 0.95); color: white; padding: 5px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
        .play-btn { width: 100%; border: none; background: #e50914; color: white; padding: 9px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .play-btn:hover { background: #ff1722; }
        .loading { text-align: center; color: #888; padding: 60px 20px; font-size: 14px; }
        .empty { text-align: center; color: #777; padding: 60px 20px; display: none; }
        .player-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.94); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .player-modal.show { display: flex; }
        .player-box { width: min(1100px, 100%); background: #0d0d0d; border: 1px solid #292929; border-radius: 10px; overflow: hidden; }
        .player-header { height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #121212; border-bottom: 1px solid #252525; }
        .player-title { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
        .close-player { width: 36px; height: 36px; border-radius: 50%; border: none; background: #333; color: white; font-size: 23px; cursor: pointer; flex-shrink: 0; }
        .close-player:hover { background: #e50914; }
        .player-area { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; }
        .player-area iframe, .player-area video { width: 100%; height: 100%; border: none; display: block; background: #000; }
        .player-message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 25px; background: #000; }
        .player-message.show { display: flex; }
        footer { text-align: center; padding: 30px; border-top: 1px solid #202020; color: #666; font-size: 12px; }
        @media (max-width: 700px) {
            header { height: auto; min-height: 70px; padding: 13px 15px; flex-wrap: wrap; gap: 10px; }
            .search-box { order: 3; flex-basis: 100%; max-width: none; }
            .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .poster-container { height: 230px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Stream<span>Vibe</span></div>
        <div class="search-box"><input type="search" id="searchInput" placeholder="Search movies, series..." autocomplete="off"></div>
        <a href="admin.html" class="admin-btn">Admin Panel</a>
    </header>

    <nav class="navigation">
        <button class="category-btn active" data-category="All">Home</button>
        <button class="category-btn" data-category="Movie">Movies</button>
        <button class="category-btn" data-category="Web Series">Web Series</button>
        <button class="category-btn" data-category="Anime">Anime</button>
        <button class="category-btn" data-category="TV">TV Shows</button>
    </nav>

    <main>
        <div class="section-header">
            <h2 class="section-title">Latest Releases</h2>
            <span class="movie-count" id="movieCount">Loading...</span>
        </div>
        <div class="loading" id="loading">Loading movies...</div>
        <div class="movie-grid" id="movieGrid"></div>
        <div class="empty" id="emptyMessage">No movies found.</div>
    </main>

    <div class="player-modal" id="playerModal">
        <div class="player-box">
            <div class="player-header">
                <div class="player-title" id="playerTitle">Movie</div>
                <button class="close-player" id="closePlayer" type="button">&times;</button>
            </div>
            <div class="player-area">
                <iframe id="iframePlayer" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="display:none;"></iframe>
                <video id="videoPlayer" controls playsinline preload="metadata" style="display:none;"></video>
                <div class="player-message" id="playerMessage">
                    <h3>Video cannot be played</h3>
                    <p id="playerMessageText">The video source is unavailable.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>© 2026 StreamVibe. All rights reserved.</footer>

    <script>
        let allMovies = [];
        let selectedCategory = "All";

        const movieGrid = document.getElementById("movieGrid");
        const loading = document.getElementById("loading");
        const emptyMessage = document.getElementById("emptyMessage");
        const movieCount = document.getElementById("movieCount");
        const searchInput = document.getElementById("searchInput");
        const playerModal = document.getElementById("playerModal");
        const playerTitle = document.getElementById("playerTitle");
        const iframePlayer = document.getElementById("iframePlayer");
        const videoPlayer = document.getElementById("videoPlayer");
        const playerMessage = document.getElementById("playerMessage");
        const playerMessageText = document.getElementById("playerMessageText");
        const closePlayer = document.getElementById("closePlayer");

        let hlsInstance = null; // Hls.js instance tracker

        async function loadMovies() {
            try {
                loading.style.display = "block";
                const response = await fetch("/api/movies");
                const data = await response.json();
                allMovies = data;
                renderMovies();
            } catch (error) {
                movieGrid.innerHTML = "";
                emptyMessage.style.display = "block";
                emptyMessage.innerText = "Unable to load movies.";
                movieCount.innerText = "Error";
            } finally {
                loading.style.display = "none";
            }
        }

        function renderMovies() {
            const searchText = searchInput.value.trim().toLowerCase();
            let filteredMovies = allMovies.filter(movie => {
                const category = String(movie.category || "").trim();
                const title = String(movie.title || "").toLowerCase();
                const categoryMatch = selectedCategory === "All" || category === selectedCategory;
                const searchMatch = !searchText || title.includes(searchText);
                return categoryMatch && searchMatch;
            });

            movieGrid.innerHTML = "";
            movieCount.innerText = filteredMovies.length + (filteredMovies.length === 1 ? " title" : " titles");

            if (filteredMovies.length === 0) {
                emptyMessage.style.display = "block";
                return;
            }
            emptyMessage.style.display = "none";

            filteredMovies.forEach(movie => {
                const card = createMovieCard(movie);
                movieGrid.appendChild(card);
            });
        }

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "movie-card";
            const poster = movie.poster_url || "https://via.placeholder.com/400x600?text=No+Poster";
            const title = movie.title || "Untitled";
            const category = movie.category || "Movie";

            card.innerHTML = `
                <div class="poster-container">
                    <img src="${escapeHtml(poster)}" alt="${escapeHtml(title)}" loading="lazy">
                    <div class="movie-category">${escapeHtml(category)}</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">${escapeHtml(title)}</div>
                    <button class="play-btn" type="button">&#9658; Play Now</button>
                </div>
            `;
            card.querySelector(".play-btn").addEventListener("click", () => openPlayer(movie));
            return card;
        }

        function openPlayer(movie) {
            playerTitle.innerText = movie.title || "Movie";

            // Cleanup previous instances
            iframePlayer.src = "";
            videoPlayer.pause();
            videoPlayer.removeAttribute("src");
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            iframePlayer.style.display = "none";
            videoPlayer.style.display = "none";
            playerMessage.classList.remove("show");

            const sourceType = String(movie.source_type || "").toLowerCase();
            let source = "";

            if (sourceType === "embed" && movie.embed_link) {
                openIframe(movie.embed_link.trim());
            } else if (sourceType === "gdrive" || (movie.drive_link && isGoogleDriveUrl(movie.drive_link))) {
                source = convertGoogleDriveToPreview(movie.drive_link.trim());
                if (source) openIframe(source);
                else showPlayerError("Invalid Google Drive link.");
            } else if (sourceType === "hls" || (movie.drive_link && movie.drive_link.includes(".m3u8"))) {
                openHlsVideo(movie.drive_link.trim());
            } else if (movie.drive_link) {
                openVideo(movie.drive_link.trim());
            } else if (movie.embed_link) {
                openIframe(movie.embed_link.trim());
            } else {
                showPlayerError("No video source available.");
            }

            playerModal.classList.add("show");
            document.body.style.overflow = "hidden";
        }

        function openIframe(url) {
            iframePlayer.src = url;
            iframePlayer.style.display = "block";
            videoPlayer.style.display = "none";
        }

        function openVideo(url) {
            videoPlayer.style.display = "block";
            iframePlayer.style.display = "none";
            videoPlayer.src = url;
            videoPlayer.load();
            videoPlayer.play().catch(() => {});
            videoPlayer.onerror = () => showPlayerError("Direct video link cannot be played.");
        }

        function openHlsVideo(url) {
            videoPlayer.style.display = "block";
            iframePlayer.style.display = "none";

            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(() => {});
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        showPlayerError("HLS stream playback failed.");
                    }
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support for Safari / iOS
                videoPlayer.src = url;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    videoPlayer.play().catch(() => {});
                });
            } else {
                showPlayerError("HLS is not supported in this browser.");
            }
        }

        function convertGoogleDriveToPreview(url) {
            if (!url) return "";
            if (url.includes("drive.google.com/file/") && url.includes("/preview")) return url;
            let match = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
            if (match && match[1]) return "https://drive.google.com/file/d/" + encodeURIComponent(match[1]) + "/preview";
            match = url.match(/[?&]id=([^&]+)/);
            if (match && match[1]) return "https://drive.google.com/file/d/" + encodeURIComponent(match[1]) + "/preview";
            return "";
        }

        function isGoogleDriveUrl(url) {
            return url && (url.includes("drive.google.com") || url.includes("docs.google.com"));
        }

        function showPlayerError(message) {
            iframePlayer.style.display = "none";
            videoPlayer.style.display = "none";
            playerMessageText.innerText = message;
            playerMessage.classList.add("show");
        }

        function closeMoviePlayer() {
            iframePlayer.src = "";
            videoPlayer.pause();
            videoPlayer.removeAttribute("src");
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            playerModal.classList.remove("show");
            document.body.style.overflow = "";
        }

        closePlayer.addEventListener("click", closeMoviePlayer);
        playerModal.addEventListener("click", (e) => { if (e.target === playerModal) closeMoviePlayer(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && playerModal.classList.contains("show")) closeMoviePlayer(); });
        searchInput.addEventListener("input", renderMovies);

        document.querySelectorAll(".category-btn").forEach(button => {
            button.addEventListener("click", function() {
                document.querySelectorAll(".category-btn").forEach(btn => btn.classList.remove("active"));
                this.classList.add("active");
                selectedCategory = this.dataset.category;
                renderMovies();
            });
        });

        function escapeHtml(value) {
            return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadMovies();
    </script>
</body>
</html>
