<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Professional OTT Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; padding-bottom: 70px; overflow-x: hidden; }

        /* Navbar Styling */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #111; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; gap: 15px; }
        .nav-left { display: flex; align-items: center; gap: 20px; flex: 1; }
        .logo-icon { background: #e50914; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .search-box { background: #222; border: 1px solid #444; padding: 8px 15px; border-radius: 20px; color: #fff; width: 100%; max-width: 300px; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: #e50914; }
        .admin-btn { background: #e50914; color: #fff; padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .admin-btn:hover { background: #ff0f1b; }

        /* Category Tabs */
        .category-tabs { display: flex; gap: 10px; padding: 20px 40px; overflow-x: auto; scrollbar-width: none; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; white-space: nowrap; }
        .tab-btn:hover, .tab-btn.active { background: #e50914; color: #fff; border-color: #e50914; }

        /* Banner Slider & Wrapper */
        .hero-banner-wrapper { position: relative; width: 100%; padding: 0 40px; margin: 0 auto 30px auto; display: none; }
        .hero-banner { position: relative; width: 100%; max-width: 100%; height: 400px; border-radius: 12px; overflow: hidden; background: #141414; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: flex-end; padding: 35px; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #0b0b0b; }
        .hero-slide.active { opacity: 1; }
        .hero-slide::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 75%; background: linear-gradient(to top, #0b0b0b, rgba(11,11,11,0.4), transparent); }
        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero-title { font-size: clamp(22px, 4vw, 36px); font-weight: bold; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        .hero-desc { font-size: clamp(12px, 2vw, 14px); color: #ccc; margin-bottom: 15px; }
        .hero-play-btn { background: #e50914; color: #fff; border: none; padding: 10px 22px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; transition: 0.2s; }
        .hero-play-btn:hover { background: #ff0f1b; }

        /* Slider Control Arrows */
        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid #444; font-size: 20px; padding: 10px 14px; cursor: pointer; z-index: 10; border-radius: 50%; transition: 0.3s; }
        .slider-arrow:hover { background: #e50914; border-color: #e50914; }
        .prev-arrow { left: 20px; }
        .next-arrow { right: 20px; }

        /* Movie Section Grid */
        .section-container { padding: 0 40px; margin-bottom: 40px; }
        .section-title { font-size: 20px; margin-bottom: 20px; border-left: 4px solid #e50914; padding-left: 10px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        .movie-card { background: #141414; border-radius: 8px; overflow: hidden; border: 1px solid #222; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
        .movie-poster { width: 100%; height: 250px; object-fit: cover; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-actions { display: flex; gap: 8px; }
        .action-btn { flex: 1; padding: 7px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 12px; text-decoration: none; cursor: pointer; border: none; }
        .play-btn { background: #e50914; color: #fff; }
        .play-btn:hover { background: #ff0f1b; }
        .download-btn { background: #222; color: #ccc; }
        .download-btn:hover { background: #333; color: #fff; }

        /* Bottom Mobile Navigation Bar */
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 1px solid #222; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .bottom-nav-item { color: #888; text-decoration: none; font-size: 11px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .bottom-nav-item.active { color: #e50914; }

        /* Responsive Media Queries for Mobile & Tablets */
        @media(max-width: 768px) {
            body { padding-bottom: 80px; }
            .navbar { padding: 12px 15px; flex-direction: row; }
            .nav-left { gap: 10px; }
            .search-box { max-width: 150px; padding: 6px 12px; font-size: 13px; }
            .admin-btn { padding: 6px 12px; font-size: 12px; }
            
            .category-tabs { padding: 12px 15px; }
            .hero-banner-wrapper { padding: 0 10px; margin-bottom: 20px; }
            .hero-banner { height: 230px; border-radius: 8px; }
            .hero-slide { padding: 20px; }
            .slider-arrow { display: none; }
            
            .section-container { padding: 0 15px; }
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .movie-poster { height: 210px; }
            
            .bottom-nav { display: flex; }
        }

        @media(max-width: 480px) {
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .movie-poster { height: 180px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-icon">&#9658;</div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search..." onkeyup="filterMovies()">
        </div>
        <a href="admin.html" class="admin-btn">Admin Panel</a>
    </div>

    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('All', this)">Home</button>
        <button class="tab-btn" onclick="filterCategory('Movie', this)">Movies</button>
        <button class="tab-btn" onclick="filterCategory('TV', this)">TV Shows</button>
        <button class="tab-btn" onclick="filterCategory('Anime', this)">Anime</button>
        <button class="tab-btn" onclick="filterCategory('Web Series', this)">Web Series</button>
    </div>

    <!-- Banner Wrapper with Arrows -->
    <div class="hero-banner-wrapper" id="bannerWrapper">
        <button class="slider-arrow prev-arrow" onclick="prevSlide()">&#10094;</button>
        <div class="hero-banner" id="heroSlider"></div>
        <button class="slider-arrow next-arrow" onclick="nextSlide()">&#10095;</button>
    </div>

    <div class="section-container">
        <h3 class="section-title" id="sectionHeading">Latest Releases</h3>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">🏠<span>Home</span></a>
        <a href="index.html" class="bottom-nav-item">🎬<span>Series</span></a>
        <a href="admin.html" class="bottom-nav-item">➕<span>Admin</span></a>
    </div>

    <script>
        let allMovies = [];
        let currentCategory = 'All';
        let currentSlide = 0;
        let slideInterval;

        async function fetchMovies() {
            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();
                displayMovies(allMovies);
                setupHeroSlider(allMovies);
            } catch (err) { console.error("Error fetching movies:", err); }
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (movies.length === 0) {
                grid.innerHTML = '<p style="color: #666; font-size: 14px;">No content available in this category.</p>';
                return;
            }

            movies.forEach(movie => {
                // Priority: Use embed_link if available, otherwise fallback to drive_link
                const playLink = (movie.embed_link && movie.embed_link.trim() !== "") ? movie.embed_link : movie.drive_link;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div>
                        <img src="${movie.poster_url}" alt="${movie.title}" class="movie-poster">
                        <div class="movie-info">
                            <div class="movie-title">${movie.title}</div>
                        </div>
                    </div>
                    <div style="padding: 0 10px 10px 10px;">
                        <div class="movie-actions">
                            <a href="${playLink}" target="_blank" class="action-btn play-btn">Play</a>
                            <a href="${movie.drive_link || playLink}" target="_blank" class="action-btn download-btn">Link</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('sectionHeading').innerText = category === 'All' ? 'Latest Releases' : `${category} Collections`;

            if (category === 'All') {
                displayMovies(allMovies);
            } else {
                const filtered = allMovies.filter(m => m.category && m.category.toLowerCase() === category.toLowerCase());
                displayMovies(filtered);
            }
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => {
                const matchesCategory = currentCategory === 'All' || (m.category && m.category.toLowerCase() === currentCategory.toLowerCase());
                const matchesSearch = m.title.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            displayMovies(filtered);
        }

        let heroMovies = [];

        function setupHeroSlider(movies) {
            const slider = document.getElementById('heroSlider');
            const wrapper = document.getElementById('bannerWrapper');
            slider.innerHTML = '';

            heroMovies = movies.filter(m => m.banner_url && m.banner_url.trim() !== "");

            if (heroMovies.length === 0) {
                wrapper.style.display = 'none';
                return;
            }

            wrapper.style.display = 'block';

            heroMovies.forEach((movie, index) => {
                const heroPlayLink = (movie.embed_link && movie.embed_link.trim() !== "") ? movie.embed_link : movie.drive_link;
                const slide = document.createElement('div');
                slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url('${movie.banner_url}')`;
                slide.innerHTML = `
                    <div class="hero-content">
                        <div class="hero-title">${movie.title}</div>
                        <div class="hero-desc">StreamVibe Original | ${movie.category}</div>
                        <a href="${heroPlayLink}" target="_blank" class="hero-play-btn">▶ Watch Now</a>
                    </div>
                `;
                slider.appendChild(slide);
            });

            startSlideTimer();
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.hero-slide');
            if (slides.length === 0) return;
            
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function nextSlide() {
            clearInterval(slideInterval);
            showSlide(currentSlide + 1);
            startSlideTimer();
        }

        function prevSlide() {
            clearInterval(slideInterval);
            showSlide(currentSlide - 1);
            startSlideTimer();
        }

        function startSlideTimer() {
            clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                showSlide(currentSlide + 1);
            }, 6000);
        }

        fetchMovies();
    </script>
</body>
</html>
