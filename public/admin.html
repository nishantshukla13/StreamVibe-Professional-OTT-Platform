<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0b0b0b; color: #fff; padding: 40px; }
        #loginOverlay { position: fixed; inset: 0; background: #0b0b0b; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { width: 380px; max-width: calc(100% - 30px); background: #161616; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        .login-box h2 { color: #e50914; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 13px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; margin-bottom: 15px; outline: none; font-size: 14px; }
        .login-box input:focus { border-color: #e50914; }
        .login-box button { width: 100%; padding: 13px; background: #e50914; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .login-box button:hover { background: #ff1722; }
        .login-error { color: #e50914; font-size: 13px; margin-top: 12px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        h1 { color: #e50914; font-size: 26px; }
        .nav-right-links { display: flex; gap: 15px; align-items: center; }
        .home-link, .pass-btn { color: #aaa; text-decoration: none; font-size: 14px; background: #1a1a1a; padding: 9px 16px; border-radius: 5px; border: 1px solid #333; cursor: pointer; }
        .home-link:hover, .pass-btn:hover { color: white; background: #262626; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .upload-slot-card { background: #141414; border: 2px dashed #333; height: 280px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: .3s; }
        .upload-slot-card:hover { border-color: #e50914; background: #181112; transform: translateY(-4px); }
        .plus-icon { font-size: 48px; color: #e50914; margin-bottom: 10px; }
        .slot-text { font-size: 15px; color: #888; font-weight: 600; }
        .section-title { font-size: 20px; margin-bottom: 20px; border-left: 4px solid #e50914; padding-left: 10px; }
        .manage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .manage-card { background: #141414; border: 1px solid #222; border-radius: 8px; padding: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .manage-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .manage-info img { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; }
        .manage-details { min-width: 0; }
        .manage-details h4 { font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .manage-details p { font-size: 11px; color: #888; }
        .action-btns-group { display: flex; gap: 6px; }
        .edit-btn, .delete-btn { border: none; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .edit-btn { background: #333; color: white; }
        .delete-btn { background: #e50914; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: #161616; padding: 35px; border-radius: 10px; width: 450px; max-width: 100%; border: 1px solid #333; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 25px; cursor: pointer; color: #888; }
        .close-btn:hover { color: white; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 11px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #e50914; }
        .submit-btn { width: 100%; padding: 12px; background: #e50914; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .msg { text-align: center; margin-top: 10px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>Admin Authentication</h2>
        <form id="loginForm">
            <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" required autocomplete="current-password">
            <button type="submit" id="loginButton">Access Dashboard</button>
            <p id="loginErrorMsg" class="login-error"></p>
        </form>
    </div>
</div>

<div class="header-flex">
    <h1>Admin Studio Dashboard</h1>
    <div class="nav-right-links">
        <button class="pass-btn" onclick="openPassModal()">Change Password</button>
        <a href="index.html" class="home-link">&larr; View Live Website</a>
    </div>
</div>

<div class="admin-grid">
    <div class="upload-slot-card" onclick="openUploadModal()"><div class="plus-icon">+</div><div class="slot-text">Add New Content</div></div>
    <div class="upload-slot-card" onclick="openUploadModal()"><div class="plus-icon">+</div><div class="slot-text">Add Web Series</div></div>
    <div class="upload-slot-card" onclick="openUploadModal()"><div class="plus-icon">+</div><div class="slot-text">Add Anime</div></div>
</div>

<h3 class="section-title">Manage & Delete Uploaded Content</h3>
<div class="manage-list" id="manageContentList"></div>

<div class="modal" id="uploadModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeUploadModal()">&times;</span>
        <h3 id="modalTitle">Upload Movie / Series</h3>
        <form id="mediaUploadForm">
            <input type="hidden" id="editMovieId">
            <div class="form-group"><label>Title Name</label><input type="text" id="title" placeholder="Movie title" required></div>
            <div class="form-group"><label>Category</label><select id="category"><option value="Movie">Movie</option><option value="Web Series">Web Series</option><option value="Anime">Anime</option><option value="TV">TV Shows</option></select></div>
            <div class="form-group"><label>Poster Image URL</label><input type="url" id="poster_url" placeholder="https://..." required></div>
            <div class="form-group"><label>Banner Image URL</label><input type="url" id="banner_url" placeholder="https://..."></div>
            <div class="form-group" id="sourceSelectGroup">
                <label>Video Source</label>
                <select id="uploadType" onchange="toggleSourceInput()">
                    <option value="link">Direct Video URL (.mp4)</option>
                    <option value="hls">HLS Streaming (.m3u8)</option>
                    <option value="embed">Embed / Iframe URL</option>
                    <option value="gdrive">Google Drive</option>
                </select>
            </div>
            <div class="form-group" id="linkSourceGroup"><label>Direct Video / HLS Link</label><input type="url" id="drive_link" placeholder="https://... or .m3u8"></div>
            <div class="form-group" id="embedSourceGroup" style="display:none;"><label>Embed URL</label><input type="url" id="embed_link" placeholder="https://..."></div>
            <div class="form-group" id="gdriveSourceGroup" style="display:none;"><label>Google Drive Link</label><input type="url" id="gdrive_link" placeholder="https://drive.google.com/file/d/..."></div>
            <button type="submit" class="submit-btn" id="submitBtnText">Publish Content</button>
        </form>
        <p id="modalMsg" class="msg"></p>
    </div>
</div>

<div class="modal" id="passModal">
    <div class="modal-content" style="width:380px;">
        <span class="close-btn" onclick="closePassModal()">&times;</span>
        <h3>Change Admin Password</h3>
        <form id="changePassForm">
            <div class="form-group"><label>Old Password</label><input type="password" id="oldPassword" required></div>
            <div class="form-group"><label>New Password</label><input type="password" id="newPassword" required></div>
            <button type="submit" class="submit-btn">Update Password</button>
        </form>
        <p id="passMsg" class="msg"></p>
    </div>
</div>

<script>
let isAuthenticated = false;
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const password = document.getElementById("adminPasswordInput").value.trim();
    const errorElement = document.getElementById("loginErrorMsg");
    const loginButton = document.getElementById("loginButton");
    errorElement.innerText = "";
    if (!password) return;
    loginButton.disabled = true;
    loginButton.innerText = "Checking...";
    try {
        const response = await fetch("/api/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
        });
        const data = await response.json();
        if (data.success) {
            isAuthenticated = true;
            document.getElementById("loginOverlay").style.display = "none";
            loadAdminContent();
        } else {
            errorElement.innerText = data.message || "Login failed.";
        }
    } catch (error) {
        errorElement.innerText = "Server error.";
    } finally {
        loginButton.disabled = false;
        loginButton.innerText = "Access Dashboard";
    }
});

function openPassModal() { if (!isAuthenticated) return alert("Please login first."); document.getElementById("passModal").style.display = "flex"; }
function closePassModal() { document.getElementById("passModal").style.display = "none"; }

document.getElementById("changePassForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const oldPassword = document.getElementById("oldPassword").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();
    const message = document.getElementById("passMsg");
    try {
        const response = await fetch("/api/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await response.json();
        message.innerText = data.message;
        message.style.color = data.success ? "#2ecc71" : "#e50914";
        if (data.success) setTimeout(() => { closePassModal(); document.getElementById("changePassForm").reset(); message.innerText = ""; }, 1500);
    } catch (e) { message.innerText = "Server error."; }
});

const uploadModal = document.getElementById("uploadModal");
function openUploadModal() {
    if (!isAuthenticated) return alert("Please login first!");
    document.getElementById("modalTitle").innerText = "Upload Movie / Series";
    document.getElementById("submitBtnText").innerText = "Publish Content";
    document.getElementById("mediaUploadForm").reset();
    document.getElementById("editMovieId").value = "";
    document.getElementById("sourceSelectGroup").style.display = "block";
    toggleSourceInput();
    uploadModal.style.display = "flex";
}
function closeUploadModal() { uploadModal.style.display = "none"; }

function toggleSourceInput() {
    const type = document.getElementById("uploadType").value;
    document.getElementById("linkSourceGroup").style.display = (type === "link" || type === "hls") ? "block" : "none";
    document.getElementById("embedSourceGroup").style.display = type === "embed" ? "block" : "none";
    document.getElementById("gdriveSourceGroup").style.display = type === "gdrive" ? "block" : "none";
}

async function loadAdminContent() {
    if (!isAuthenticated) return;
    const container = document.getElementById("manageContentList");
    try {
        const response = await fetch("/api/movies");
        const movies = await response.json();
        container.innerHTML = "";
        if (movies.length === 0) { container.innerHTML = "<p style='color:#666'>No content uploaded yet.</p>"; return; }
        movies.forEach(movie => {
            const card = document.createElement("div");
            card.className = "manage-card";
            card.innerHTML = `
                <div class="manage-info">
                    <img src="${escapeHtml(movie.poster_url || "")}" alt="">
                    <div class="manage-details"><h4>${escapeHtml(movie.title)}</h4><p>${escapeHtml(movie.category)}</p></div>
                </div>
                <div class="action-btns-group">
                    <button class="edit-btn" onclick='openEditModalById(${movie.id})'>Edit</button>
                    <button class="delete-btn" onclick='deleteMovie(${movie.id})'>Delete</button>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (e) { container.innerHTML = "<p style='color:#e50914'>Error loading content.</p>"; }
}

async function openEditModalById(id) {
    try {
        const res = await fetch("/api/movies");
        const movies = await res.json();
        const movie = movies.find(m => Number(m.id) === Number(id));
        if (movie) openEditModal(movie);
    } catch (e) { alert("Error loading movie"); }
}

function openEditModal(movie) {
    if (!isAuthenticated) return;
    document.getElementById("modalTitle").innerText = "Edit Movie Details";
    document.getElementById("submitBtnText").innerText = "Update Content";
    document.getElementById("editMovieId").value = movie.id;
    document.getElementById("title").value = movie.title || "";
    document.getElementById("category").value = movie.category || "Movie";
    document.getElementById("poster_url").value = movie.poster_url || "";
    document.getElementById("banner_url").value = movie.banner_url || "";
    document.getElementById("drive_link").value = movie.drive_link || "";
    document.getElementById("embed_link").value = movie.embed_link || "";
    document.getElementById("gdrive_link").value = "";
    document.getElementById("sourceSelectGroup").style.display = "none";
    document.getElementById("linkSourceGroup").style.display = "block";
    document.getElementById("embedSourceGroup").style.display = "none";
    document.getElementById("gdriveSourceGroup").style.display = "none";
    uploadModal.style.display = "flex";
}

async function deleteMovie(id) {
    if (!isAuthenticated || !confirm("Delete this movie?")) return;
    try {
        const res = await fetch("/api/delete-movie/" + id, { method: "DELETE" });
        const result = await res.json();
        if (result.success) loadAdminContent();
        else alert(result.message);
    } catch (e) { alert("Server error."); }
}

document.getElementById("mediaUploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    if (!isAuthenticated) return;
    const editId = document.getElementById("editMovieId").value;
    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const poster_url = document.getElementById("poster_url").value.trim();
    const banner_url = document.getElementById("banner_url").value.trim();
    const uploadType = document.getElementById("uploadType").value;
    const drive_link = document.getElementById("drive_link").value.trim();
    const embed_link = document.getElementById("embed_link").value.trim();
    const googleDriveLink = document.getElementById("gdrive_link").value.trim();

    let finalDriveLink = "";
    let finalEmbedLink = "";
    let sourceType = uploadType;

    if (uploadType === "gdrive") {
        finalDriveLink = googleDriveLink;
        sourceType = "gdrive";
    } else if (uploadType === "embed") {
        finalEmbedLink = embed_link;
        sourceType = "embed";
    } else if (uploadType === "hls") {
        finalDriveLink = drive_link;
        sourceType = "hls";
    } else {
        finalDriveLink = drive_link;
        sourceType = "link";
    }

    try {
        let res;
        if (editId) {
            res = await fetch("/api/update-movie/" + editId, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, category, poster_url, banner_url, drive_link: finalDriveLink, embed_link: finalEmbedLink, source_type: sourceType })
            });
        } else {
            res = await fetch("/api/upload-content", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, category, poster_url, banner_url, uploadType: sourceType, drive_link: finalDriveLink, embed_link: finalEmbedLink })
            });
        }
        const result = await res.json();
        const msg = document.getElementById("modalMsg");
        msg.style.color = result.success ? "#2ecc71" : "#e50914";
        msg.innerText = result.message;
        if (result.success) {
            setTimeout(() => { closeUploadModal(); loadAdminContent(); }, 1000);
        }
    } catch (e) { document.getElementById("modalMsg").innerText = "Server error."; }
});

function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
toggleSourceInput();
</script>
</body>
</html>
